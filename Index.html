<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón de Quejas y Pizarrón</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
        }

        /* Estilos del Formulario */
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #004494;
        }

        /* Estilos del Pizarrón */
        .board-container {
            background-color: #e8dcb8; /* Color tipo corcho/madera clara */
            border: 10px solid #8b5a2b; /* Borde de madera */
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            min-height: 400px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Estilo de las notas (quejas) */
        .note {
            background-color: #fffd75; /* Color nota adhesiva */
            padding: 15px;
            border-radius: 2px;
            width: 200px;
            min-height: 150px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.1);
            position: relative;
            transform: rotate(-1deg);
            transition: transform 0.2s;
            word-wrap: break-word;
        }

        .note:nth-child(even) {
            transform: rotate(2deg);
            background-color: #a4f4e4;
        }

        .note:nth-child(3n) {
            transform: rotate(-2deg);
            background-color: #ffb6c1;
        }

        .note:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .note-header {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
            color: #333;
        }

        .note-date {
            font-size: 0.7em;
            color: #666;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>

    <h1>Buzón de Sugerencias y Quejas</h1>

    <!-- Formulario -->
    <div class="form-container">
        <form id="quejaForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre (opcional)">
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="anonimo">
                <label for="anonimo" style="margin: 0;">Enviar de forma anónima</label>
            </div>

            <div class="form-group">
                <label for="mensaje">Tu mensaje/queja:</label>
                <textarea id="mensaje" rows="4" placeholder="Escribe tu queja o sugerencia aquí..." required></textarea>
            </div>

            <button type="submit">Publicar en el Pizarrón</button>
        </form>
    </div>

    <h2>Pizarrón Público</h2>
    <!-- Pizarrón donde aparecen las notas -->
    <div class="board-container" id="pizarron">
        <!-- Las notas aparecerán aquí mediante JavaScript -->
    </div>

    <script>
        // Referencias a los elementos del DOM
        const form = document.getElementById('quejaForm');
        const inputNombre = document.getElementById('nombre');
        const checkboxAnonimo = document.getElementById('anonimo');
        const inputMensaje = document.getElementById('mensaje');
        const pizarron = document.getElementById('pizarron');

        // Función para deshabilitar el campo de nombre si es anónimo
        checkboxAnonimo.addEventListener('change', function() {
            if (this.checked) {
                inputNombre.value = '';
                inputNombre.disabled = true;
            } else {
                inputNombre.disabled = false;
            }
        });

        // Cargar quejas guardadas en el navegador
        let quejas = JSON.parse(localStorage.getItem('quejasGuardadas')) || [];

        // Función para mostrar una nota en el pizarrón
        function renderizarNota(queja) {
            const nota = document.createElement('div');
            nota.classList.add('note');

            const autor = document.createElement('div');
            autor.classList.add('note-header');
            autor.textContent = queja.autor;

            const contenido = document.createElement('div');
            contenido.textContent = queja.mensaje;

            const fecha = document.createElement('div');
            fecha.classList.add('note-date');
            fecha.textContent = queja.fecha;

            nota.appendChild(autor);
            nota.appendChild(contenido);
            nota.appendChild(fecha);

            pizarron.appendChild(nota);
        }

        // Mostrar las notas existentes al cargar la página
        quejas.forEach(renderizarNota);

        // Evento al enviar el formulario
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            // Determinar el autor
            let autorFinal = "Anónimo";
            if (!checkboxAnonimo.checked && inputNombre.value.trim() !== "") {
                autorFinal = inputNombre.value.trim();
            }

            // Crear el objeto de la queja
            const nuevaQueja = {
                autor: autorFinal,
                mensaje: inputMensaje.value.trim(),
                fecha: new Date().toLocaleDateString()
            };

            // Guardar en el arreglo y en localStorage
            quejas.push(nuevaQueja);
            localStorage.setItem('quejasGuardadas', JSON.stringify(quejas));

            // Mostrar en el pizarrón
            renderizarNota(nuevaQueja);

            // Limpiar el formulario
            form.reset();
            inputNombre.disabled = false;
        });
    </script>
</body>
</html>
